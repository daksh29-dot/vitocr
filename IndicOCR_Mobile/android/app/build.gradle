// app/build.gradle
// ─────────────────────────────────────────────────────────────────────────────
// Android app module build file for Indic OCR with ONNX & Apache POI Support.
// ─────────────────────────────────────────────────────────────────────────────

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.indicocr'
    compileSdk 34

    defaultConfig {
        applicationId "com.indicocr"
        minSdk 26                    // Android 8 – required by ONNX Runtime Mobile
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // CRITICAL: Required for massive scale method pools brought by Apache POI
        multiDexEnabled true
    }

    // ── APK splits: build separate slim APKs per ABI (Optimized Sizing) ──────
    splits {
        abi {
            enable false
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled   false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    // CRITICAL: Allocation limits optimized for large testing pipelines
    dexOptions {
        javaMaxHeapSize "4g"  // Allocates 4GB heap space to build dex pipelines cleanly
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // Required for Apache POI stream lambdas to run on Android 8 & 9
        coreLibraryDesugaringEnabled true
    }

    // Pack the ONNX model without compression & manage duplicate metadata profiles
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/versions/9/module-info.class'
            ]
        }
    }

    // Prevent large model file from being compressed (speeds up cold start)
    aaptOptions {
        noCompress "onnx", "pt"
    }
}

dependencies {
    // ── ONNX Runtime Mobile (ARM-optimised, ~3 MB) ────────────────────────────
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // ── OpenCV — required by WordSegmenter (classical fallback) and
    //    TextDetector (DBNet post-processing: threshold/contours/unclip) ─────
    // NOTE: this was missing from the original build.gradle even though
    // WordSegmenter.java already depends on org.opencv.* — added here.
    implementation 'org.opencv:opencv:4.9.0'

    // ── Room + FTS4 (Global Search database) ──────────────────────────────
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ── RecyclerView (search results list) ────────────────────────────────
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ── CardView (rounded, elevated preview/result surfaces) ───────────────
    implementation 'androidx.cardview:cardview:1.0.0'

    // ── Apache POI — Excel export (mirrors pandas to_excel) ───────────────
    // DOWNGRADED: 5.2.5 -> 4.1.2 to fix LambdaMetafactory / Hidden API crashes on Android
    implementation 'org.apache.poi:poi-ooxml:4.1.2'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.6.2'
    implementation 'javax.xml.stream:stax-api:1.0-2'

    // ── Desugaring for POI on Android API < 26 ────────────────────────────
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ── Standard Android Core View Bindings ──────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // ── Image Cropper (uCrop for variable rotation) ──────────────────────────
    // RESTORED: Prevents compilation failures within your CustomUCropActivity
    implementation 'com.github.yalantis:ucrop:2.2.11'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}